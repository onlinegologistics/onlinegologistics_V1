name: Deploy OnlineGoLogistics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST secret is missing"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_USER secret is missing"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error::VPS_SSH_KEY secret is missing"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create release package
        run: |
          rm -f release.tar.gz "$RUNNER_TEMP/release.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='release.tar.gz' \
            --exclude='backend/.env' \
            --exclude='backend/database' \
            --exclude='backend/node_modules' \
            --exclude='backend/wa-auth' \
            --exclude='frontend/node_modules' \
            --exclude='wa-auth' \
            -czf "$RUNNER_TEMP/release.tar.gz" .
          cp "$RUNNER_TEMP/release.tar.gz" release.tar.gz

      - name: Upload release to VPS
        timeout-minutes: 3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p /tmp/onlinegologistics-deploy"

          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            release.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/onlinegologistics-deploy/release.tar.gz"

      - name: Deploy uploaded release
        uses: appleboy/ssh-action@v1.0.0
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: BACKEND_ENV,BACKEND_ENV_B64
          script: |
            set -eu

            log() {
              echo "---- $1 ----"
            }

            fail() {
              echo "::error::$1"
              exit 1
            }

            require_cmd() {
              command -v "$1" >/dev/null 2>&1 || fail "Missing required command on VPS: $1"
            }

            docker_cmd() {
              seconds="$1"
              shift
              if [ "${USE_SUDO_DOCKER:-0}" = "1" ]; then
                timeout "$seconds" sudo -n docker "$@"
              else
                timeout "$seconds" docker "$@"
              fi
            }

            PROJECT_DIR=/var/www/onlinegologistics/onlinegologistics
            ARCHIVE=/tmp/onlinegologistics-deploy/release.tar.gz
            DEPLOY_USER=$(id -un)

            log "Checking VPS tools"
            require_cmd tar
            require_cmd docker
            require_cmd timeout

            [ -f "$ARCHIVE" ] || fail "Release archive not found at $ARCHIVE"

            if timeout 20 docker ps >/dev/null 2>&1; then
              USE_SUDO_DOCKER=0
            elif timeout 20 sudo -n docker ps >/dev/null 2>&1; then
              USE_SUDO_DOCKER=1
            else
              fail "Docker is installed, but this user cannot run Docker. Add the VPS user to the docker group or allow passwordless sudo for docker."
            fi

            log "Preparing project directory"
            if ! mkdir -p "$PROJECT_DIR" 2>/dev/null; then
              sudo -n mkdir -p "$PROJECT_DIR" || fail "Cannot create $PROJECT_DIR. Give the VPS user write access or passwordless sudo."
            fi

            if sudo -n true >/dev/null 2>&1; then
              sudo -n chown -R "$DEPLOY_USER:$DEPLOY_USER" "$PROJECT_DIR" || true
            fi

            [ -w "$PROJECT_DIR" ] || fail "VPS user cannot write to $PROJECT_DIR"

            log "Extracting release"
            tar -xzf "$ARCHIVE" -C "$PROJECT_DIR"

            if [ -n "${BACKEND_ENV_B64:-}" ]; then
              log "Writing backend/.env from BACKEND_ENV_B64 secret"
              printf '%s' "$BACKEND_ENV_B64" | base64 -d > "$PROJECT_DIR/backend/.env"
            elif [ -n "${BACKEND_ENV:-}" ]; then
              log "Writing backend/.env from BACKEND_ENV secret"
              printf '%s\n' "$BACKEND_ENV" > "$PROJECT_DIR/backend/.env"
            fi

            if [ ! -f "$PROJECT_DIR/backend/.env" ]; then
              fail "Missing backend/.env. Add BACKEND_ENV_B64 or BACKEND_ENV in GitHub Actions secrets to deploy without manually entering the VPS."
            fi

            chmod 600 "$PROJECT_DIR/backend/.env" || true
            mkdir -p "$PROJECT_DIR/wa-auth"

            log "Restarting Docker services"
            cd "$PROJECT_DIR"

            log "Building backend image"
            if docker_cmd 600 build -t onlinegologistics_backend:latest ./backend 2>&1; then
              :
            else
              fail "Docker build failed or timed out on VPS"
            fi

            log "Replacing backend container"
            docker_cmd 30 stop --time 10 onlinegologistics_backend 2>&1 || true
            docker_cmd 30 rm onlinegologistics_backend 2>&1 || true

            log "Starting backend container"
            if docker_cmd 60 run -d \
              --name onlinegologistics_backend \
              --restart always \
              -p 5003:5003 \
              --env-file "$PROJECT_DIR/backend/.env" \
              -v "$PROJECT_DIR/wa-auth:/app/wa-auth" \
              onlinegologistics_backend:latest 2>&1; then
              :
            else
              fail "Docker container failed to start on VPS"
            fi

            sleep 5
            docker_cmd 30 ps --filter "name=onlinegologistics_backend" 2>&1 || true
            if ! docker_cmd 30 ps --filter "name=onlinegologistics_backend" --filter "status=running" --format "{{.Names}}" | grep -qx "onlinegologistics_backend"; then
              docker_cmd 30 logs --tail=160 onlinegologistics_backend 2>&1 || true
              fail "Backend container is not running after Docker start"
            fi

            log "Deployment complete"
            echo "Deployment complete!"
